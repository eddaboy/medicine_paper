[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-delphi-experiments"
version = "0.1.0"
description = "Data and reproducible analyses for clinical multi-model Delphi experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.1.3",
  "pandas==3.0.3",
  "scipy==1.14.1",
  "statsmodels==0.14.6",
  "matplotlib==3.10.9",
  "seaborn==0.13.2",
  "scikit-learn==1.9.0",
  "pyarrow==25.0.0",
  "openpyxl==3.1.5",
  "nbformat==5.10.4",
  "nbclient==0.10.4",
  "nbconvert==7.17.1",
  "ipykernel==7.2.0",
  "jupyterlab==4.5.7",
  "requests==2.34.2",
  "tqdm==4.68.4",
]

[project.optional-dependencies]
generation = [
  "openai==3.28.0",
  "anthropic==0.101.0",
  "datasets",
  "tiktoken",
  "optuna",
]

[tool.setuptools]
py-modules = []
